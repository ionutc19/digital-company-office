name: CI

on:
  pull_request:
  push:
    branches: [digital-company, 'claude/**']

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack (Yarn 1.22.22 from packageManager)
        run: corepack enable
      - name: Install (frozen lockfiles)
        shell: bash
        run: |
          yarn install --frozen-lockfile
          (cd types && yarn install --frozen-lockfile)
          (cd client && yarn install --frozen-lockfile)
      - name: Server typecheck + adapter tests
        run: |
          yarn typecheck
          yarn test
      - name: Client typecheck + production build
        working-directory: client
        run: |
          yarn typecheck
          yarn build
