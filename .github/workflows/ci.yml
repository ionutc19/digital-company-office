name: CI

on:
  pull_request:
  push:
    branches: [digital-company, 'claude/**']

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '26']
    runs-on: ${{ matrix.os }}
    name: build-test (${{ matrix.os }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # Node 25+ no longer bundles Corepack; install the pinned Yarn classic.
      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22
      - name: Install (frozen lockfiles)
        shell: bash
        run: |
          node -v; yarn -v
          yarn install --frozen-lockfile
          (cd client && yarn install --frozen-lockfile)
      - name: Server typecheck + adapter tests
        run: |
          yarn typecheck
          yarn test
      - name: Client typecheck + production build
        working-directory: client
        run: |
          yarn typecheck
          yarn build
      - name: Hermes Dashboard plugin bundle
        working-directory: client
        run: yarn build:plugin
      # One installable plugin per run (Linux, Node 26), used by
      # digital-company/bootstrap/install-office-plugin.ps1 -FromCi.
      - name: Upload plugin artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == '26'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digital-company-plugin
          path: |
            hermes-plugin/digital-company/plugin.yaml
            hermes-plugin/digital-company/__init__.py
            hermes-plugin/digital-company/dashboard/manifest.json
            hermes-plugin/digital-company/dashboard/plugin_api.py
            hermes-plugin/digital-company/dashboard/dist/
          if-no-files-found: error
          retention-days: 30

  plugin-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies (pinned to Hermes v2026.9.24 versions)
        run: pip install -r hermes-plugin/requirements-dev.txt
      - name: Fetch pinned Hermes source for the contract test
        run: |
          git init -q "$RUNNER_TEMP/hermes"
          git -C "$RUNNER_TEMP/hermes" fetch -q --depth 1 https://github.com/NousResearch/hermes-agent tag v2026.9.24
          git -C "$RUNNER_TEMP/hermes" checkout -q FETCH_HEAD
      - name: Plugin backend tests + Hermes contract
        env:
          HERMES_SRC: ${{ runner.temp }}/hermes
        run: python -m pytest -q hermes-plugin/tests
